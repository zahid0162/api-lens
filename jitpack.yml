jdk:
  - openjdk21
before_install:
  - yes | sdkmanager --licenses >/dev/null 2>&1 || true
  - sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
install:
  - |
    GRADLE_CMD="gradle"
    if [ -f "./gradlew" ]; then
      chmod +x ./gradlew
      GRADLE_CMD="./gradlew"
    fi
    $GRADLE_CMD :api-lens:publishToMavenLocal :api-lens-noop:publishToMavenLocal -x test --no-daemon
